<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Income Tax Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 40px;
      color: #1f2937;
    }
    .card {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h1 { margin-top: 0; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { margin-top: 16px; width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; font-size: 16px; }
    .result { margin-top: 20px; padding: 12px; background: #eff6ff; border-radius: 8px; }
    .result p { margin: 6px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Income Tax Calculator</h1>
    <label for="income">Annual Income</label>
    <input id="income" type="number" min="0" step="0.01" placeholder="Enter income" />

    <label for="deductions">Deductions</label>
    <input id="deductions" type="number" min="0" step="0.01" placeholder="Enter deductions" />

    <button onclick="calculateTax()">Calculate</button>

    <div id="result" class="result" style="display:none;"></div>
  </div>

  <script>
    function calculateTax() {
      const income = parseFloat(document.getElementById('income').value) || 0;
      const deductions = parseFloat(document.getElementById('deductions').value) || 0;

      const taxableIncome = Math.max(income - deductions, 0);
      const oldTax = calculateSlabTax(taxableIncome, [300000, 300000, 300000, Infinity], [0.0, 0.05, 0.20, 0.30]);
      const newTax = calculateSlabTax(taxableIncome, [300000, 300000, 300000, Infinity], [0.0, 0.05, 0.20, 0.30]);
      const recommendedRegime = oldTax <= newTax ? 'Old Regime' : 'New Regime';

      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = `
        <p><strong>Taxable Income:</strong> ₹${taxableIncome.toFixed(2)}</p>
        <p><strong>Old Regime Tax:</strong> ₹${oldTax.toFixed(2)}</p>
        <p><strong>New Regime Tax:</strong> ₹${newTax.toFixed(2)}</p>
        <p><strong>Recommended Regime:</strong> ${recommendedRegime}</p>
      `;
    }

    function calculateSlabTax(income, limits, rates) {
      let tax = 0;
      let remaining = income;
      for (let i = 0; i < limits.length; i++) {
        const limit = limits[i];
        const rate = rates[i];
        if (remaining <= 0) break;
        const taxableAmount = Math.min(remaining, limit === Infinity ? remaining : limit);
        tax += taxableAmount * rate;
        remaining -= taxableAmount;
      }
      return roundToTwo(tax);
    }

    function roundToTwo(value) {
      return Math.round(value * 100) / 100;
    }
  </script>
</body>
</html>
